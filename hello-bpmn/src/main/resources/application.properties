spring.application.name=hello-bpmn
# Database H2 in-memory (data hilang saat aplikasi berhenti)
spring.datasource.url=jdbc:h2:mem:hellobpmn;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# Flowable membuat tabel otomatis
flowable.database-schema-update=true
# Lokasi file proses (default)
flowable.process-definition-location-prefix=classpath*:/processes/
flowable.process-definition-location-suffixes=**.bpmn20.xml,**.bpmn
